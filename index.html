<style>
:root,[data-theme=ocean]{--hd:#08141F;--bg:#0C1D2E;--sf:#122B42;--s2:#18364F;--ln:#244A68;--tx:#EAF3F8;--mu:#8DAFC4;--ac:#FF6B35;--ok:#2EC4B6;--hot:#FF5A5F;--on:#fff}
[data-theme=porcelain]{--hd:#12304A;--bg:#EDF1F5;--sf:#fff;--s2:#E4EBF2;--ln:#D3DCE5;--tx:#0F2233;--mu:#60768A;--ac:#1F5FE0;--ok:#0E9F77;--hot:#E5484D;--on:#fff}
[data-theme=emerald]{--hd:#04100B;--bg:#07150F;--sf:#0E2219;--s2:#153127;--ln:#20503D;--tx:#E6F6EE;--mu:#84B09C;--ac:#F2C14E;--ok:#3DDC97;--hot:#FF6B6B;--on:#1a1300}
[data-theme=plum]{--hd:#0E0A1B;--bg:#150F25;--sf:#1E1736;--s2:#281F48;--ln:#3A2E66;--tx:#F0EBFA;--mu:#A99BD0;--ac:#FF5C8A;--ok:#5EEAD4;--hot:#FF8A5C;--on:#fff}
[data-theme=sggreen]{--hd:#062A1F;--bg:#0A3226;--sf:#0F4030;--s2:#15503C;--ln:#226650;--tx:#EAF7EF;--mu:#8DC2A9;--ac:#A6CE39;--ok:#2EC4B6;--hot:#FF6B5A;--on:#0B2A10}
[data-theme=sgblue]{--hd:#07203F;--bg:#0A2A52;--sf:#103862;--s2:#17477A;--ln:#2A5F96;--tx:#EAF3FB;--mu:#92B7DA;--ac:#A6CE39;--ok:#1FBFA6;--hot:#FF6B5A;--on:#0B2A10}
[data-theme=sglight]{--hd:#0B4A3A;--bg:#F1F7F3;--sf:#FFFFFF;--s2:#E1EEE6;--ln:#CFE0D6;--tx:#0E2F25;--mu:#5E7F70;--ac:#2E9E5B;--ok:#1FA89A;--hot:#E5484D;--on:#FFFFFF}
[data-theme=graphite]{--hd:#0D0F12;--bg:#14171B;--sf:#1D2127;--s2:#272C34;--ln:#363D48;--tx:#EEF1F5;--mu:#9AA4B2;--ac:#22D3EE;--ok:#34D399;--hot:#FB7185;--on:#04222A}
[data-theme=royal]{--hd:#0A1030;--bg:#0E1640;--sf:#172256;--s2:#1F2E6E;--ln:#34459A;--tx:#EEF1FF;--mu:#9AA8E0;--ac:#F5C542;--ok:#4ADE80;--hot:#FB7185;--on:#231A00}
[data-theme=sunset]{--hd:#1F0A14;--bg:#2A0F1D;--sf:#3A1628;--s2:#4C1E34;--ln:#6B2D4A;--tx:#FFF0F3;--mu:#D9A0B3;--ac:#FF8A3D;--ok:#34D399;--hot:#FF4D6D;--on:#2A1000}
[data-theme=mist]{--hd:#1F2937;--bg:#F3F4F6;--sf:#FFFFFF;--s2:#E5E7EB;--ln:#D1D5DB;--tx:#111827;--mu:#6B7280;--ac:#7C3AED;--ok:#059669;--hot:#DC2626;--on:#FFFFFF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--hd)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font-family:Cairo,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow-x:hidden;transition:background .4s}
button{font-family:inherit;color:inherit}
.hd{background:var(--hd);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 22px;border-radius:0 0 30px 30px}
.max{max-width:560px;margin:0 auto}
.r0{display:flex;align-items:center;justify-content:space-between}
.r0 h1{margin:0;font-size:25px;font-weight:800}
.r0 small{display:block;color:#ffffff99;font-size:13px;margin-top:2px}
.ib{width:42px;height:42px;border-radius:14px;border:0;background:#ffffff18;display:grid;place-items:center;color:#fff;transition:transform .2s,background .2s}
.ib:active{transform:scale(.88);background:#ffffff30}
.ib svg,.sb svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.st{display:flex;align-items:center;gap:18px;margin-top:18px}
.ring{position:relative;width:78px;height:78px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .a{stroke:#ffffff22}.ring .b{stroke:var(--ok);stroke-dasharray:201;stroke-dashoffset:201;transition:stroke-dashoffset 1s cubic-bezier(.2,.9,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:18px;font-weight:800}
.nums{flex:1;display:grid;grid-template-columns:repeat(3,1fr)}
.nums div{text-align:center;padding:2px 0;border-inline-start:1px solid #ffffff1c}
.nums div:first-child{border:0}
.nums b{display:block;font-size:28px;font-weight:800;line-height:1.1}
.nums span{font-size:12.5px;color:#ffffffa0}
.nums b.k{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.35)}}
.ctl{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);padding:14px 16px 8px}
.sb{display:flex;align-items:center;gap:10px;background:var(--sf);border:1.5px solid var(--ln);border-radius:16px;padding:0 14px;color:var(--mu);transition:border-color .2s}
.sb:focus-within{border-color:var(--ac)}
.sb input{flex:1;background:none;border:0;outline:0;color:var(--tx);font:16px Cairo,sans-serif;padding:13px 0;min-width:0}
.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--ln);background:none;color:var(--mu);border-radius:20px;padding:7px 15px;font:600 14px Cairo,sans-serif;transition:all .25s}
.chip em{font-style:normal;opacity:.7;margin-inline-start:6px;font-size:12.5px}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--on)}
.wrap{padding:6px 16px calc(120px + env(safe-area-inset-bottom,0px))}
.gl{display:flex;justify-content:space-between;color:var(--mu);font-size:13px;font-weight:600;margin:16px 4px 8px}
.rw{display:flex;gap:13px;background:var(--sf);border-radius:18px;padding:13px 13px 13px 14px;margin-bottom:9px;border-inline-start:5px solid var(--ac);position:relative;overflow:hidden;animation:in .5s cubic-bezier(.2,1.2,.4,1) both;transition:opacity .35s,transform .35s,border-color .35s}
.rw.hot{border-inline-start-color:var(--hot)}
.rw.done{border-inline-start-color:var(--ok);opacity:.6}
.rw:active{transform:scale(.985)}
.rw.fl::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 12% 40%,var(--ok),transparent 60%);opacity:0;animation:fl .7s}
@keyframes fl{30%{opacity:.4}to{opacity:0}}
@keyframes in{from{opacity:0;transform:translateY(16px)}}
.ck{flex:none;align-self:flex-start;width:32px;height:32px;margin-top:2px;border-radius:50%;border:2.5px solid var(--ln);background:none;display:grid;place-items:center;padding:0;transition:all .3s}
.ck:active{transform:scale(.82)}
.ck svg{width:18px;height:18px;stroke:#fff;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:26;stroke-dashoffset:26;transition:stroke-dashoffset .4s .1s}
.done .ck{background:var(--ok);border-color:var(--ok);animation:pop .5s}
.done .ck svg{stroke-dashoffset:0}
@keyframes pop{40%{transform:scale(1.35)}}
.bd{flex:1;min-width:0}
.r1{display:flex;align-items:center;gap:7px}
.r1 b{font-size:16.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r1 .tm{margin-inline-start:auto;font-size:12px;color:var(--mu);flex:none}
.fire{color:var(--hot);font-size:15px;flex:none}
.rt{margin-top:4px;font-size:14.5px;font-weight:600}
.rt i{font-style:normal;color:var(--ac);margin:0 4px}
.tx{margin-top:3px;color:var(--mu);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-word}
.done .r1 b,.done .rt{text-decoration:line-through;text-decoration-color:var(--ok)}
.r3{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.tg{background:var(--s2);border-radius:9px;padding:4px 10px;font-size:12.5px;font-weight:600;text-decoration:none;color:var(--tx)}
.tg.p{background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok)}
.tg.w{background:#25D366;color:#06210f}
.more{display:block;margin:12px auto;background:var(--s2);border:0;border-radius:14px;padding:11px 26px;font:600 14px Cairo,sans-serif}
.empty{text-align:center;color:var(--mu);padding:56px 20px;animation:in .6s both}
.empty .bx{font-size:56px;display:inline-block;animation:fy 3s ease-in-out infinite}
@keyframes fy{50%{transform:translateY(-10px)}}
.empty b{display:block;color:var(--tx);font-size:17px;margin:10px 0 4px}
.fab{position:fixed;inset-inline-end:18px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border-radius:22px;border:0;background:var(--ac);color:var(--on);display:grid;place-items:center;box-shadow:0 12px 30px #0006;z-index:6;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.fab:active{transform:scale(.88)}
.fab svg{width:28px;height:28px;stroke:currentColor;stroke-width:2.8;fill:none;stroke-linecap:round}
.bg{position:fixed;inset:0;background:#000b;opacity:0;pointer-events:none;transition:opacity .35s;z-index:8}
.bg.on{opacity:1;pointer-events:auto}
.sh{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(106%);transition:transform .5s cubic-bezier(.2,1.05,.3,1);z-index:9}
.sh.on{transform:none}
.gr{width:44px;height:5px;border-radius:3px;background:var(--ln);margin:0 auto 14px}
.sh h2{margin:0 0 14px;font-size:20px;font-weight:800}
.fld{width:100%;background:var(--sf);border:1.5px solid var(--ln);border-radius:14px;color:var(--tx);font:16px Cairo,sans-serif;padding:12px 14px;margin-bottom:10px;outline:0;transition:border-color .2s}
.fld:focus{border-color:var(--ac)}
textarea.fld{height:84px;resize:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lb{font-size:13px;color:var(--mu);margin:2px 2px 7px;font-weight:600}
.cc{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.cc button{border:1.5px solid var(--ln);background:var(--sf);border-radius:12px;padding:8px 14px;font:600 14px Cairo,sans-serif;transition:all .2s}
.cc button.on{background:var(--ac);border-color:var(--ac);color:var(--on)}
.sw{display:flex;align-items:center;justify-content:space-between;background:var(--sf);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-weight:600}
.tg2{width:50px;height:30px;border-radius:15px;background:var(--ln);border:0;position:relative;transition:background .3s;padding:0}
.tg2::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.tg2.on{background:var(--hot)}
.tg2.on::after{transform:translateX(-20px)}
.bt{width:100%;border:0;border-radius:15px;padding:15px;font:800 17px Cairo,sans-serif;background:var(--ac);color:var(--on);transition:transform .2s}
.bt:active{transform:scale(.97)}
.bt.g{background:var(--s2);color:var(--tx);font-size:15px;margin-top:9px;padding:12px}
.bt.d{background:none;color:var(--hot);font-size:15px;margin-top:6px;padding:10px}
.th{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.th button{border:2px solid transparent;background:var(--sf);border-radius:16px;padding:10px 2px;font:600 12px Cairo,sans-serif;display:grid;gap:8px;justify-items:center;transition:all .25s}
.th button.on{border-color:var(--ac)}
.th i{width:34px;height:34px;border-radius:50%;display:block}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;background:var(--tx);color:var(--bg);border-radius:16px;padding:12px 18px;font-weight:600;display:flex;gap:14px;align-items:center;z-index:12;transition:all .4s cubic-bezier(.2,1.2,.4,1);pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:none;border:0;color:var(--ac);font:800 15px Cairo,sans-serif;padding:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="hd"><div class="max">
  <div class="r0"><div><h1>ريكوستات الواتساب</h1><small id="dt"></small></div>
    <button class="ib" id="gear" aria-label="الإعدادات"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
  <div class="st"><div class="ring"><svg width="78" height="78" viewBox="0 0 78 78"><circle class="a" cx="39" cy="39" r="32"/><circle class="b" id="rg" cx="39" cy="39" r="32"/></svg><b id="pc">0%</b></div>
    <div class="nums"><div><b id="n1">0</b><span>مستني رد</span></div><div><b id="n2">0</b><span>تم الرد</span></div><div><b id="n3">0</b><span>عاجل</span></div></div></div>
</div></div>
<div class="ctl"><div class="max">
  <label class="sb"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" placeholder="دور بالاسم أو الرقم أو الوجهة أو السعر" enterkeyhint="search"></label>
  <div class="chips" id="chips"><button class="chip on" data-f="all">الكل<em></em></button><button class="chip" data-f="open">مستني رد<em></em></button><button class="chip" data-f="hot">عاجل<em></em></button><button class="chip" data-f="done">تم الرد<em></em></button></div>
</div></div>
<div class="wrap"><div class="max" id="list"></div></div>
<button class="fab" id="fab" aria-label="ريكوست جديد"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<div class="bg" id="bg"></div>

<div class="sh" id="sh"><div class="gr"></div><h2 id="sht">ريكوست جديد</h2>
  <input class="fld" id="fn" placeholder="اسم العميل / الشركة" autocomplete="off">
  <input class="fld" id="fp" placeholder="رقم الواتساب (اختياري)" inputmode="tel" dir="ltr" style="text-align:right">
  <div class="two"><input class="fld" id="fa" placeholder="من (الميناء)" autocomplete="off"><input class="fld" id="fb" placeholder="إلى (الميناء)" autocomplete="off"></div>
  <div class="lb">نوع الشحنة</div>
  <div class="cc" id="cc"><button data-c="20GP">20GP</button><button data-c="40GP">40GP</button><button data-c="40HC">40HC</button><button data-c="LCL">LCL</button><button data-c="Air">جوي</button><button data-c="Other">تاني</button></div>
  <input class="fld" id="fr" placeholder="السعر اللي اتبعت (اختياري) مثال: USD 1450" autocomplete="off">
  <textarea class="fld" id="ft" placeholder="تفاصيل الطلب أو ملاحظات"></textarea>
  <div class="sw"><span>🔥 عاجل</span><button class="tg2" id="fu" aria-label="عاجل"></button></div>
  <button class="bt" id="sv">حفظ</button>
  <button class="bt d" id="dl">مسح الريكوست</button>
</div>

<div class="sh" id="se"><div class="gr"></div><h2>الإعدادات</h2>
  <div class="lb">شكل التطبيق</div>
  <div class="th" id="th"><button data-t="sggreen"><i style="background:linear-gradient(135deg,#0A3226 50%,#A6CE39 50%);border:1px solid #8884"></i>SG أخضر</button><button data-t="sgblue"><i style="background:linear-gradient(135deg,#0A2A52 50%,#A6CE39 50%);border:1px solid #8884"></i>SG أزرق</button><button data-t="sglight"><i style="background:linear-gradient(135deg,#F1F7F3 50%,#2E9E5B 50%);border:1px solid #8884"></i>SG فاتح</button>
    <button data-t="ocean"><i style="background:linear-gradient(135deg,#0C1D2E 50%,#FF6B35 50%)"></i>محيط</button>
    <button data-t="porcelain"><i style="background:linear-gradient(135deg,#EDF1F5 50%,#1F5FE0 50%);border:1px solid #ccd"></i>فاتح</button>
    <button data-t="emerald"><i style="background:linear-gradient(135deg,#07150F 50%,#F2C14E 50%)"></i>زمرد</button>
    <button data-t="plum"><i style="background:linear-gradient(135deg,#150F25 50%,#FF5C8A 50%)"></i>بنفسجي</button>
  <button data-t="graphite"><i style="background:linear-gradient(135deg,#14171B 50%,#22D3EE 50%);border:1px solid #8884"></i>جرافيت</button><button data-t="royal"><i style="background:linear-gradient(135deg,#0E1640 50%,#F5C542 50%);border:1px solid #8884"></i>ملكي</button><button data-t="sunset"><i style="background:linear-gradient(135deg,#2A0F1D 50%,#FF8A3D 50%);border:1px solid #8884"></i>غروب</button><button data-t="mist"><i style="background:linear-gradient(135deg,#F3F4F6 50%,#7C3AED 50%);border:1px solid #8884"></i>رمادي</button></div>
  <div class="lb">نسخة احتياطية (انسخ النص واحفظه في الملاحظات)</div>
  <textarea class="fld" id="bk" style="height:96px;font-size:12px" dir="ltr" placeholder="الصق هنا النسخة اللي حفظتها عشان تستوردها"></textarea>
  <div class="two"><button class="bt g" id="ex" style="margin:0">نسخ البيانات</button><button class="bt g" id="im" style="margin:0">استيراد</button></div>
  <button class="bt d" id="clr">مسح كل البيانات</button>
</div>
<div class="toast" id="ts"><span id="tm"></span><button id="tu">تراجع</button></div>

<script>
var KEY="wa_requests_v1",PK="wa_prefs_v1",items=[],P={theme:"ocean"},flt="all",qs="",lim=40,cont="",eid=null,undo=null,tt;
function ld(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
items=ld(KEY,[]);P=ld(PK,P);
function sv(){try{localStorage.setItem(KEY,JSON.stringify(items));localStorage.setItem(PK,JSON.stringify(P))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function dk(t){return new Date(t).setHours(0,0,0,0)}
function lab(k){var d=dk(Date.now());if(k==d)return"النهاردة";if(k==d-864e5)return"إمبارح";return new Date(k).toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long"})}
function hm(t){return new Date(t).toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"})}
function setTheme(t){P.theme=t;document.documentElement.setAttribute("data-theme",t);[].forEach.call($("th").children,function(b){b.classList.toggle("on",b.dataset.t==t)});sv()}
function num(id,v){var e=$(id);if(e.textContent!=v){e.textContent=v;e.classList.remove("k");void e.offsetWidth;e.classList.add("k")}}
function stats(){var n=items.length,d=items.filter(function(x){return x.done}).length,h=items.filter(function(x){return x.urgent&&!x.done}).length,p=n?Math.round(d/n*100):0;
  $("rg").style.strokeDashoffset=201-201*p/100;$("pc").textContent=p+"%";num("n1",n-d);num("n2",d);num("n3",h);
  var c=[n,n-d,h,d];[].forEach.call($("chips").children,function(b,i){b.lastChild.textContent=c[i]})}
function filtered(){var t=qs.trim().toLowerCase();return items.filter(function(x){
  if(flt=="open"&&x.done)return false;if(flt=="done"&&!x.done)return false;if(flt=="hot"&&(!x.urgent||x.done))return false;
  if(t&&[x.name,x.phone,x.pol,x.pod,x.cont,x.price,x.text].join(" ").toLowerCase().indexOf(t)<0)return false;return true})
  .sort(function(a,b){return (dk(b.ts)-dk(a.ts))||(a.done-b.done)||((b.urgent?1:0)-(a.urgent?1:0))||(b.ts-a.ts)})}
function row(x,i){
  var rt=(x.pol||x.pod)?'<div class="rt">'+esc(x.pol||"؟")+'<i>←</i>'+esc(x.pod||"؟")+'</div>':"";
  var tags=(x.cont?'<span class="tg">'+esc(x.cont)+'</span>':"")+(x.price?'<span class="tg p">'+esc(x.price)+'</span>':"")+(x.phone?'<a class="tg w" href="https://wa.me/'+esc(x.phone.replace(/\D/g,""))+'">واتساب</a>':"");
  return '<div class="rw'+(x.done?" done":"")+(x.urgent&&!x.done?" hot":"")+'" data-id="'+x.id+'" style="animation-delay:'+Math.min(i,8)*35+'ms">'+
  '<button class="ck" aria-label="تم الرد"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button><div class="bd">'+
  '<div class="r1"><b>'+esc(x.name)+'</b>'+(x.urgent&&!x.done?'<span class="fire">🔥</span>':"")+'<span class="tm">'+hm(x.ts)+'</span></div>'+rt+
  (x.text?'<div class="tx">'+esc(x.text)+'</div>':"")+(tags?'<div class="r3">'+tags+'</div>':"")+'</div></div>'}
function render(){stats();var a=filtered(),L=$("list");
  if(!a.length){L.innerHTML='<div class="empty"><div class="bx">'+(items.length?"🔍":"📦")+'</div><b>'+(items.length?"مفيش نتيجة":"لسه مفيش ريكوستات")+'</b>'+(items.length?"جرّب كلمة تانية أو فلتر تاني":"دوس على زرار + وسجّل أول ريكوست")+'</div>';return}
  var h="",k=null,s=a.slice(0,lim);
  s.forEach(function(x,i){var g=dk(x.ts);if(g!==k){k=g;var c=a.filter(function(y){return dk(y.ts)==g&&!y.done}).length;h+='<div class="gl"><span>'+lab(g)+'</span><span>'+(c?c+" مستني":"خلصت ✓")+'</span></div>'}h+=row(x,i)});
  if(a.length>lim)h+='<button class="more" id="mr">عرض المزيد ('+(a.length-lim)+')</button>';
  L.innerHTML=h}
function find(id){return items.filter(function(x){return x.id===id})[0]}
$("list").addEventListener("click",function(e){
  if(e.target.id=="mr"){lim+=40;render();return}
  var r=e.target.closest(".rw");if(!r||e.target.closest("a"))return;var x=find(+r.dataset.id);
  if(e.target.closest(".ck")){x.done=!x.done;x.dts=x.done?Date.now():0;sv();r.classList.toggle("done",x.done);r.classList.remove("hot");if(x.done)r.classList.add("fl");stats();if(navigator.vibrate)navigator.vibrate(12);setTimeout(render,650)}
  else openForm(x.id)});
$("chips").addEventListener("click",function(e){var b=e.target.closest(".chip");if(!b)return;flt=b.dataset.f;lim=40;[].forEach.call($("chips").children,function(c){c.classList.toggle("on",c===b)});render()});
$("q").addEventListener("input",function(){qs=this.value;lim=40;render()});
function show(id,on){$(id).classList.toggle("on",on);$("bg").classList.toggle("on",on)}
function closeAll(){show("sh",false);show("se",false)}
$("bg").onclick=closeAll;
function pickC(c){cont=c;[].forEach.call($("cc").children,function(b){b.classList.toggle("on",b.dataset.c==c)})}
$("cc").onclick=function(e){var b=e.target.closest("button");if(b)pickC(cont==b.dataset.c?"":b.dataset.c)};
$("fu").onclick=function(){this.classList.toggle("on")};
function openForm(id){eid=id||null;var x=id?find(id):{};
  $("sht").textContent=id?"تعديل الريكوست":"ريكوست جديد";$("dl").style.display=id?"block":"none";
  $("fn").value=x.name||"";$("fp").value=x.phone||"";$("fa").value=x.pol||"";$("fb").value=x.pod||"";$("fr").value=x.price||"";$("ft").value=x.text||"";
  pickC(x.cont||"");$("fu").classList.toggle("on",!!x.urgent);$("fn").style.borderColor="";show("sh",true);
  if(!id)setTimeout(function(){$("fn").focus()},400)}
$("fab").onclick=function(){openForm()};
$("sv").onclick=function(){var n=$("fn").value.trim();if(!n){$("fn").style.borderColor="var(--hot)";$("fn").focus();return}
  var d={name:n,phone:$("fp").value.trim(),pol:$("fa").value.trim(),pod:$("fb").value.trim(),cont:cont,price:$("fr").value.trim(),text:$("ft").value.trim(),urgent:$("fu").classList.contains("on")};
  if(eid){var x=find(eid);for(var k in d)x[k]=d[k]}else{d.id=Date.now();d.ts=Date.now();d.done=false;items.push(d);flt="all";qs="";$("q").value="";[].forEach.call($("chips").children,function(c,i){c.classList.toggle("on",i==0)})}
  sv();closeAll();render()};
function toast(m,u){$("tm").textContent=m;$("tu").style.display=u?"block":"none";$("ts").classList.add("on");clearTimeout(tt);tt=setTimeout(function(){$("ts").classList.remove("on");undo=null},5000)}
$("dl").onclick=function(){var x=find(eid);undo=x;items=items.filter(function(y){return y!==x});sv();closeAll();render();toast("اتمسح الريكوست",true)};
$("tu").onclick=function(){if(undo){items.push(undo);undo=null;sv();render()}$("ts").classList.remove("on")};
$("gear").onclick=function(){$("bk").value="";show("se",true)};
$("th").onclick=function(e){var b=e.target.closest("button");if(b)setTheme(b.dataset.t)};
$("ex").onclick=function(){var b=$("bk");b.value=JSON.stringify(items);b.select();b.setSelectionRange(0,b.value.length);var ok=false;try{ok=document.execCommand("copy")}catch(e){}
  if(!ok&&navigator.clipboard){navigator.clipboard.writeText(b.value).then(function(){toast("اتنسخت البيانات")},function(){});return}toast(ok?"اتنسخت البيانات":"انسخ النص ده بإيدك")};
$("im").onclick=function(){try{var a=JSON.parse($("bk").value),n=0;if(!Array.isArray(a))throw 0;a.forEach(function(x){if(x&&x.id&&x.name&&!find(x.id)){items.push(x);n++}});sv();render();closeAll();toast("اتضاف "+n+" ريكوست")}catch(e){toast("النص مش صحيح")}};
$("clr").onclick=function(){if(confirm("تمسح كل الريكوستات؟ مش هتقدر ترجعهم.")){items=[];sv();render();closeAll()}};
$("dt").textContent=new Date().toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long"});
setTheme(P.theme);render();
</script>
</body>
</html>
